name: CI

on:
  pull_request:
  # Only main. `branches: ["**"]` also matches the source branch of an open
  # PR, so every push to a PR branch fired two identical runs — double the
  # minutes and a duplicated checks list. Branches get their coverage through
  # the pull_request trigger; this one covers commits that land on main.
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci` not `install`: fails on a lockfile that disagrees with
      # package.json instead of silently resolving something new.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The deploy workflow rebuilds from source rather than consuming this,
      # so it stays reproducible from a SHA alone. Uploaded for inspection
      # when a build looks wrong.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web/dist
          retention-days: 7

  backend:
    name: backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

  image:
    name: backend — image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches a broken Dockerfile here rather than midway through a deploy.
      # Built for arm64 to match the Lambda architecture; not pushed.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: terraform — fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false: validation needs the providers, not the state. This
      # keeps CI from touching the state bucket or needing AWS credentials.
      - name: Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
