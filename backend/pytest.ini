[pytest]
testpaths = tests
# e2e talks to a running backend over HTTP (real image, real AWS); the default
# run stays offline and free, so e2e is opt-in via `-m e2e`.
addopts = -m "not e2e"
markers =
    real_seams: run against the unpatched app.graph.models seams
    e2e: hits a running backend over HTTP at BASE_URL
